apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: sudarshan2244/myapp:latest
        ports:
        - containerPort: 80
